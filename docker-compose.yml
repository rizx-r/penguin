networks:
  1panel-network:
    external: true
services:
  etcd:
    image: docker.1ms.run/bitnami/etcd:latest
    container_name: etcd
    networks:
      - 1panel-network
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ETCD_ENABLE_V2=true
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379,http://192.168.5.247:2379 # etcd:2379 供容器内部访问；192.168.5.247:2379供局域网内访问
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_NAME=etcd
    volumes:
      #      - ./components/bitnami/etcd:/bitnami/etcd
      - ./components/etcd/data:/bitnami/etcd/data
      - ./components/etcd/logs:/bitnami/etcd/logs

  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - 2181:2181
    container_name: zookeeper
    volumes:
      - /etc/localtime:/etc/localtime
    environment:
      TZ: Asia/Shanghai
      ALLOW_ANONYMOUS_LOGIN: "yes"
    restart: always
    networks:
      - 1panel-network

  apisix-dashboard:
    image: docker.1ms.run/apache/apisix-dashboard:latest
    container_name: apisix-dashboard
    restart: always
    depends_on:
      - etcd
    volumes:
      - ./components/apisix-dashboard/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml
    ports:
      - "9002:9000"
    networks:
      - 1panel-network

  apisix:
    image: docker.1ms.run/apache/apisix:3.13.0-ubuntu
    container_name: apisix
    restart: always
    depends_on:
      - etcd
      - apisix-dashboard
    volumes:
      - ./components/apisix/config.yaml:/usr/local/apisix/conf/config.yaml
      - ./components/apisix/logs:/usr/local/apisix/logs
    ports:
      - "9180:9180/tcp"
      - "9080:9080/tcp"
      - "9091:9091/tcp"
      - "9443:9443/tcp"
      - "9093:9092/tcp"
    networks:
      - 1panel-network
